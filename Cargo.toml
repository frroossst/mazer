cargo-features = ["codegen-backend"]

[workspace]
members = [
    # "mazer-ast",
    "mazer-atog",
    "mazer-cli",
    "mazer-dbg",
    "mazer-html",
    "mazer-lisp",
    "mazer-macros",
    "mazer-parser",
    "mazer-render",
    "mazer-stdlib",
    "mazer-types",
    "mazer-wasm",
    "mazer-units",
    # --- rewrite (see docs/ARCHITECTURE.md) ---
    "mazer-syntax",
    "mazer-math",
    "mazer-doc",
    "mazer-lsp",
]
# Plain `cargo build` / `cargo test` skip mazer-dbg (egui); build it with `-p mazer-dbg`.
default-members = [
    "mazer-atog",
    "mazer-cli",
    "mazer-html",
    "mazer-lisp",
    "mazer-macros",
    "mazer-parser",
    "mazer-render",
    "mazer-stdlib",
    "mazer-types",
    "mazer-wasm",
    "mazer-units",
    "mazer-syntax",
    "mazer-math",
    "mazer-doc",
    "mazer-lsp",
]
resolver = "3"

[workspace.dependencies]
thiserror = "2"
miette = { version = "7", default-features = false }
strsim = "0.11"

[profile.dev]
opt-level = 1
codegen-backend = "cranelift"
debug = 0
# incremental = true

[profile.dev.package."*"]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
overflow-checks = false
strip = true

[profile.release.package."*"]
opt-level = "z"

[workspace.lints.clippy]
pedantic = "deny"
nursery  = "deny"

