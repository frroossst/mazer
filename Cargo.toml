cargo-features = ["codegen-backend"]

[workspace]
members = [
    "mazer-syntax",
    "mazer-math",
    "mazer-doc",
    "mazer-cli",
    "mazer-wasm",
    "mazer-lsp",
    "mazer-dbg",
]
# Plain `cargo build` / `cargo test` skip mazer-dbg (egui); build it with `-p mazer-dbg`.
default-members = [
    "mazer-syntax",
    "mazer-math",
    "mazer-doc",
    "mazer-cli",
    "mazer-wasm",
    "mazer-lsp",
]
resolver = "3"

[profile.dev]
opt-level = 1
codegen-backend = "cranelift"
debug = 0
# incremental = true

[profile.dev.package."*"]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
overflow-checks = false
strip = true

[profile.release.package."*"]
opt-level = "z"

[workspace.lints.clippy]
pedantic = "deny"
nursery  = "deny"

