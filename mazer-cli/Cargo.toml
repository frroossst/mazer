[package]
name = "mazer-cli"
version = "0.16.0"
edition = "2024"
description = "Compile .zr notes (markdown with embedded Lisp math) to HTML and MathML"

[[bin]]
name = "mazer"
path = "src/main.rs"

[features]
# LaTeX output (`--target latex`). Off by default.
latex = ["mazer-doc/latex"]

[dependencies]
mazer-doc = { path = "../mazer-doc" }
annotate-snippets = "0.12"

[lints]
workspace = true
