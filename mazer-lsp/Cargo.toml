[package]
name = "mazer-lsp"
version = "0.16.0"
edition = "2024"
description = "Language server for mazer notes (.zr)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "mazer-lsp"
path = "src/main.rs"

[dependencies]
mazer-doc = { path = "../mazer-doc" }
lsp-server = "0.10"
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
